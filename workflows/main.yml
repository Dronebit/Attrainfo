name: Build Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android platform (only if missing)
        run: |
          if [ ! -d "android" ]; then
            PROJECT_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
            flutter create . --project-name "$PROJECT_NAME" --platforms=android
          fi

          # Патч compileSdk → 36 (nfc_manager требует 34+)
          GRADLE_FILE=$(ls android/app/build.gradle* 2>/dev/null | head -1)
          if [ -n "$GRADLE_FILE" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$GRADLE_FILE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$GRADLE_FILE"
            sed -i 's/compileSdk = 31/compileSdk = 36/g' "$GRADLE_FILE"
            sed -i 's/compileSdk = 33/compileSdk = 36/g' "$GRADLE_FILE"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$GRADLE_FILE"
            sed -i 's/compileSdk = 35/compileSdk = 36/g' "$GRADLE_FILE"
            echo "--- compileSdk ---"
            grep -i "compilesdk" "$GRADLE_FILE" || echo "(не найден — проверь вручную)"
          fi

          # NFC-разрешения в манифест
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.NFC" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.NFC"/>\n    <uses-feature android:name="android.hardware.nfc" android:required="false"/>\n    <application|' "$MANIFEST"
          fi

          # Убираем v1 embedding (applicationName)
          sed -i 's|android:name="${applicationName}"||' "$MANIFEST"

          echo "--- manifest head ---"
          head -15 "$MANIFEST"

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test || true

      - name: Build release APK
        run: flutter build apk --release -- -x lintVitalAnalyzeRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error